<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" width="680" height="260">
  <defs>
    <style>
      .bg   { fill: #0D0D0D; }
      .mono { font-family: 'Courier New', Courier, monospace; }
      .border { stroke: #2A2A2A; stroke-width: 1; fill: none; }
      .sep    { stroke: #2A2A2A; stroke-width: 1; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="680" height="260" rx="4"/>

  <!-- Outer border -->
  <rect class="border" x="30" y="20" width="620" height="220" rx="2"/>

  <!-- Header separator -->
  <line class="sep" x1="30" y1="50" x2="650" y2="50"/>

  <!-- Header text -->
  <text class="mono" x="46" y="40" font-size="12" fill="#777777" letter-spacing="1">EXIRO // SYSTEM STATUS</text>

  <!-- Status rows -->
  <!-- Row 1: SYSTEM -->
  <text class="mono" x="60" y="80" font-size="13" fill="#777777">SYSTEM</text>
  <text class="mono" x="240" y="80" font-size="13" fill="#39FF14">ONLINE</text>

  <!-- Row 2: MODE -->
  <text class="mono" x="60" y="103" font-size="13" fill="#777777">MODE</text>
  <text class="mono" x="240" y="103" font-size="13" fill="#E8E8E8">EXPLORATION</text>

  <!-- Row 3: BUILD -->
  <text class="mono" x="60" y="126" font-size="13" fill="#777777">BUILD</text>
  <text class="mono" x="240" y="126" font-size="13" fill="#D6A84F">UNSTABLE</text>

  <!-- Row 4: CURIOSITY -->
  <text class="mono" x="60" y="149" font-size="13" fill="#777777">CURIOSITY</text>
  <text class="mono" x="240" y="149" font-size="13" fill="#E8E8E8">HIGH</text>

  <!-- Row 5: IDEAS -->
  <text class="mono" x="60" y="172" font-size="13" fill="#777777">IDEAS</text>
  <text class="mono" x="240" y="172" font-size="13" fill="#E8E8E8">47</text>

  <!-- Row 6: SLEEP -->
  <text class="mono" x="60" y="195" font-size="13" fill="#777777">SLEEP</text>
  <text class="mono" x="240" y="195" font-size="13" fill="#E8E8E8">OPTIONAL</text>

  <!-- Row 7: COFFEE -->
  <text class="mono" x="60" y="218" font-size="13" fill="#777777">COFFEE</text>
  <text class="mono" x="240" y="218" font-size="13" fill="#C75C5C">NOT FOUND</text>
</svg>
